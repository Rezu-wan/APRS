services:
  # Backend API
  - type: web
    name: aprs-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: aprs-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: API_KEY_SYSTEM
        generateValue: true
      - key: API_KEY_ADMIN
        generateValue: true
      - key: API_KEY_SUPPORT
        generateValue: true
      - key: API_KEY_CUSTOMER
        generateValue: true
      - key: RECOVERY_MIN_SAFE_PROBABILITY
        value: 0.90
      - key: RECOVERY_MAX_AMOUNT
        value: 1500
      - key: RECOVERY_MAX_PREVIOUS_FAILURES
        value: 3
      - key: MODEL_DIR
        value: models
      - key: AI_PROVIDER
        value: mock
      - key: AI_TIMEOUT_SECONDS
        value: 12
    healthCheckPath: /health

  # Frontend
  - type: web
    name: aprs-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aprs-db
    databaseName: aprs_production
    plan: free
