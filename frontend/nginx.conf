server {
    # nginx-unprivileged image: non-root, so we bind the unprivileged 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Security headers -- kept in sync with the FastAPI middleware
    # (api/middleware.py: X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy) plus a conservative CSP that
    # works with a built Vite SPA (hashed, same-origin assets; styles are
    # inlined by Tailwind/Vite at build time, hence 'unsafe-inline' for
    # style-src only).
    # NOTE: connect-src is 'self' because the SPA calls the API same-origin
    # via the /api/ proxy below -- no per-deployment origin to update.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Never cache the entry point: it references the hashed asset files,
    # so updates are picked up immediately on redeploy.
    # (nginx quirk: a location that sets its own add_header does NOT inherit
    # server-level headers, so the security headers are repeated here.)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Hashed assets are immutable -- cache them for as long as possible.
    # (Same nginx add_header-inheritance quirk: repeat security headers.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Same-origin API proxy: the SPA calls /api/v1 relative to its own
    # origin, so the deployment is domain-independent (localhost, LAN IP or
    # a public domain all work unchanged) and no CORS is involved.
    # proxy_pass without a URI part forwards the original path unchanged
    # (/api/v1/... -> api:8000/api/v1/...).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # support/SSE event streams must not be buffered
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: any unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
