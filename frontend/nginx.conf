server {
    # nginx-unprivileged image: non-root, so we bind the unprivileged 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Security headers -- kept in sync with the FastAPI middleware
    # (api/middleware.py: X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy) plus a conservative CSP that
    # works with a built Vite SPA (hashed, same-origin assets; styles are
    # inlined by Tailwind/Vite at build time, hence 'unsafe-inline' for
    # style-src only).
    # NOTE: connect-src must match the deployed API origin -- update it
    # (or parameterize via a template) when the API is not on localhost:8000.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'" always;

    # Never cache the entry point: it references the hashed asset files,
    # so updates are picked up immediately on redeploy.
    # (nginx quirk: a location that sets its own add_header does NOT inherit
    # server-level headers, so the security headers are repeated here.)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Hashed assets are immutable -- cache them for as long as possible.
    # (Same nginx add_header-inheritance quirk: repeat security headers.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
